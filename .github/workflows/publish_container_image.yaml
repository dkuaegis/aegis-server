name: Publish Container Image

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradle/**"
      - "src/**"
      - ".github/workflows/publish_container_image.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-image
  queue: max

jobs:
  publish:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Calculate source tag
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_hash="$(
            git ls-tree -r HEAD -- \
              Dockerfile \
              .dockerignore \
              build.gradle \
              settings.gradle \
              gradle.properties \
              gradlew \
              gradle \
              src \
              .github/workflows/publish_container_image.yaml \
            | sha256sum \
            | cut -d ' ' -f 1
          )"

          {
            echo "repository=${image}"
            echo "source_tag=${image}:source-${source_hash}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether image already exists
        id: image_exists
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.image.outputs.source_tag }}
        run: |
          if docker buildx imagetools inspect "$SOURCE_TAG" > /dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        if: steps.image_exists.outputs.value != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: "temurin"

      - name: Set up Gradle
        if: steps.image_exists.outputs.value != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build application
        if: steps.image_exists.outputs.value != 'true'
        run: ./gradlew bootJar writeVersionFile --build-cache -x spotlessApply -x spotlessCheck

      - name: Build and push image
        id: build
        if: steps.image_exists.outputs.value != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prebuilt
          push: true
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.source_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=aegis-server
          cache-to: type=gha,mode=max,scope=aegis-server

      - name: Write image digest to summary
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          SOURCE_TAG: ${{ steps.image.outputs.source_tag }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ -n "$BUILT_DIGEST" ]]; then
            digest="$BUILT_DIGEST"
          else
            digest="$(
              docker buildx imagetools inspect "$SOURCE_TAG" --format '{{json .Manifest}}' \
              | jq -r '.digest'
            )"
          fi

          {
            echo "### Container image"
            echo
            echo "- Digest: \`${IMAGE_REPOSITORY}@${digest}\`"
            echo "- Source tag: \`${SOURCE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
