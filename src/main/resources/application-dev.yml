spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

oauth2-login:
  default-redirect-uri: ${OAUTH2_LOGIN_DEFAULT_REDIRECT_URI:https://dev-web.dkuaegis.org}
